[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"

